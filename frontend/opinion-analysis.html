<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinion Analysis - LegalReasonerX</title>
    <link rel="stylesheet" href="/css/main.css?v=2.0">
    <style>
        /* Clean Gradient - Content-First, Readable */
        body {
            background: linear-gradient(180deg, #F8FAFC 0%, #EFF6FF 50%, #F1F5F9 100%);
            position: relative;
        }

        /* Subtle accent orbs */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -5%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            padding: 3rem 0 2rem;
            animation: slideInDown 0.6s ease-out;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--neutral-600);
            font-size: 1.125rem;
        }

        .opinion-selector {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: var(--spacing-xl);
            border-radius: var(--radius-2xl);
            margin-bottom: var(--spacing-xl);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            animation: slideInUp 0.6s ease-out;
        }

        .opinion-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-2xl);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            transition: all var(--transition-slow);
            position: relative;
            overflow: hidden;
        }

        .opinion-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: var(--gradient-accent);
            transition: left var(--transition-base);
        }

        .opinion-card:hover {
            border-color: var(--secondary);
            box-shadow: var(--shadow-xl);
            transform: translateY(-4px);
        }

        .opinion-card:hover::before {
            left: 0;
        }

        .opinion-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--border);
        }

        .opinion-metadata {
            flex: 1;
        }

        .opinion-type-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-lg);
            background: var(--gradient-accent);
            color: white;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .opinion-text {
            max-height: 400px;
            overflow-y: auto;
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.9) 0%, rgba(241, 245, 249, 0.9) 100%);
            border-radius: var(--radius-xl);
            line-height: 1.8;
            white-space: pre-wrap;
            border: 1px solid var(--neutral-200);
            font-size: 0.9375rem;
            color: var(--neutral-800);
        }

        .opinion-text::-webkit-scrollbar {
            width: 10px;
        }

        .opinion-text::-webkit-scrollbar-track {
            background: var(--neutral-100);
            border-radius: var(--radius-md);
        }

        .opinion-text::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 100%);
            border-radius: var(--radius-md);
            border: 2px solid var(--neutral-100);
        }

        .opinion-text::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .opinion-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .precedent-select {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-xl);
            font-size: 1rem;
            transition: all var(--transition-base);
            background: white;
            font-family: var(--font-body);
            color: var(--neutral-900);
            cursor: pointer;
        }

        .precedent-select:hover {
            border-color: var(--primary-light);
        }

        .precedent-select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            outline: none;
        }

        .opinion-count {
            background: var(--gradient-accent);
            color: white;
            padding: var(--spacing-xs) var(--spacing-lg);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 700;
            margin-left: var(--spacing-sm);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <span class="logo-icon">⚖️</span>
                <span>LegalReasonerX</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/citation-lookup" class="nav-link">Citation Lookup</a></li>
                <li><a href="/network-viz" class="nav-link">Network</a></li>
                <li><a href="/opinion-analysis" class="nav-link active">Opinions</a></li>
                <li><a href="/reasoning" class="nav-link">Reasoning</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">📄 Opinion Analysis</h1>
            <p class="page-subtitle">Extract and analyze full legal opinions from base cases and their precedents</p>
        </div>

        <!-- Opinion Selector -->
        <div class="opinion-selector">
            <h3 style="margin-bottom: var(--spacing-md);">Select a Case</h3>
            <div class="input-group" style="margin-bottom: 0;">
                <label for="case-select">Case</label>
                <select id="case-select" onchange="loadOpinions()">
                    <option value="">-- Select a case --</option>
                </select>
            </div>
        </div>

        <!-- Base Opinions Section -->
        <div id="base-opinions-section" class="hidden">
            <h2>
                📋 Base Opinions
                <span id="base-count" class="opinion-count">0</span>
            </h2>
            <div id="base-opinions-container"></div>
        </div>

        <!-- Precedent Opinions Section -->
        <div id="precedent-opinions-section" class="hidden">
            <h2>
                ⚖️ Precedent Opinions
                <span id="precedent-count" class="opinion-count">0</span>
            </h2>
            <div class="mb-2">
                <label for="precedent-select">Select a precedent opinion</label>
                <select id="precedent-select" class="precedent-select" onchange="displaySelectedPrecedent()">
                    <option value="">-- Select a precedent --</option>
                </select>
            </div>
            <div id="precedent-opinions-container"></div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script>
        let allOpinions = null;
        let currentCase = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const precedentData = Storage.getPrecedentData();
            const apiToken = Storage.getCourtListenerToken();

            if (!precedentData || !apiToken) {
                UI.showWarning('No precedent data found. Please process a citation first.');
                setTimeout(() => {
                    window.location.href = '/citation-lookup';
                }, 3000);
                return;
            }

            // Populate case selector
            populateCaseSelector(precedentData);

            // Load opinions
            await fetchOpinions(precedentData, apiToken);
        });

        function populateCaseSelector(precedentData) {
            const caseSelect = document.getElementById('case-select');
            const cases = Object.keys(precedentData.citation_caseName_map || {});

            cases.forEach(caseName => {
                const option = document.createElement('option');
                option.value = caseName;
                option.textContent = caseName;
                caseSelect.appendChild(option);
            });

            // Auto-select first case if available
            if (cases.length > 0) {
                caseSelect.value = cases[0];
                loadOpinions();
            }
        }

        async function fetchOpinions(precedentData, apiToken) {
            UI.showLoading('Extracting opinions...');

            try {
                const response = await API.extractOpinions(apiToken, precedentData);

                if (response.success) {
                    allOpinions = response.data;
                    UI.showSuccess('Opinions extracted successfully!');
                }
            } catch (error) {
                UI.showError(error.message || 'Failed to extract opinions.');
            } finally {
                UI.hideLoading();
            }
        }

        function loadOpinions() {
            const caseSelect = document.getElementById('case-select');
            currentCase = caseSelect.value;

            if (!currentCase || !allOpinions) return;

            displayBaseOpinions();
            displayPrecedentOpinions();
        }

        function displayBaseOpinions() {
            const section = document.getElementById('base-opinions-section');
            const container = document.getElementById('base-opinions-container');
            const countBadge = document.getElementById('base-count');

            section.classList.remove('hidden');

            const baseOpinions = allOpinions.base_opinions[currentCase] || [];
            countBadge.textContent = baseOpinions.length;

            if (baseOpinions.length === 0) {
                container.innerHTML = '<p class="alert alert-info">No base opinions found for this case.</p>';
                return;
            }

            let html = '';

            baseOpinions.forEach((opinionObj, index) => {
                const opinionKey = Object.keys(opinionObj)[0];
                const opinion = opinionObj[opinionKey];

                html += `
                    <div class="opinion-card" style="animation: slideInUp 0.5s ease-out ${index * 0.1}s both;">
                        <div class="opinion-header">
                            <div class="opinion-metadata">
                                <div class="opinion-type-badge">${opinion.type}</div>
                                <h3 style="margin-bottom: var(--spacing-sm);">${opinion.case_name}</h3>
                                <p style="color: var(--text-secondary); margin-bottom: var(--spacing-xs);">
                                    <strong>Citation:</strong> ${opinion.citation}
                                </p>
                                <p style="color: var(--text-secondary);">
                                    <strong>Source:</strong> <a href="${opinion.link}" target="_blank" style="color: var(--primary-light);">View on CourtListener</a>
                                </p>
                            </div>
                        </div>

                        <div class="opinion-text" id="base-text-${index}">
                            ${opinion.opinion.substring(0, 1000)}${opinion.opinion.length > 1000 ? '...' : ''}
                        </div>

                        <div class="opinion-actions">
                            ${opinion.opinion.length > 1000 ? `
                                <button class="btn btn-outline" onclick="toggleFullText('base-text-${index}', ${index}, 'base')">
                                    📖 View Full Opinion
                                </button>
                            ` : ''}
                            <button class="btn btn-outline" onclick="copyToClipboard('${opinion.opinion.replace(/'/g, "\\'")}')">
                                📋 Copy Text
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function displayPrecedentOpinions() {
            const section = document.getElementById('precedent-opinions-section');
            const select = document.getElementById('precedent-select');
            const countBadge = document.getElementById('precedent-count');

            section.classList.remove('hidden');

            const precedentOpinions = allOpinions.precedent_opinions[currentCase] || [];
            countBadge.textContent = precedentOpinions.length;

            // Clear previous options
            select.innerHTML = '<option value="">-- Select a precedent --</option>';

            if (precedentOpinions.length === 0) {
                document.getElementById('precedent-opinions-container').innerHTML =
                    '<p class="alert alert-info">No precedent opinions found for this case.</p>';
                return;
            }

            // Populate select dropdown
            precedentOpinions.forEach((opinionObj, index) => {
                const opinionKey = Object.keys(opinionObj)[0];
                const opinion = opinionObj[opinionKey];

                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${opinion.case_name} - ${opinion.type}`;
                select.appendChild(option);
            });

            // Auto-select first precedent
            select.value = 0;
            displaySelectedPrecedent();
        }

        function displaySelectedPrecedent() {
            const select = document.getElementById('precedent-select');
            const container = document.getElementById('precedent-opinions-container');
            const index = parseInt(select.value);

            if (isNaN(index)) {
                container.innerHTML = '';
                return;
            }

            const precedentOpinions = allOpinions.precedent_opinions[currentCase];
            const opinionObj = precedentOpinions[index];
            const opinionKey = Object.keys(opinionObj)[0];
            const opinion = opinionObj[opinionKey];

            const html = `
                <div class="opinion-card" style="animation: scaleIn 0.5s ease-out;">
                    <div class="opinion-header">
                        <div class="opinion-metadata">
                            <div class="opinion-type-badge">${opinion.type}</div>
                            <h3 style="margin-bottom: var(--spacing-sm);">${opinion.case_name}</h3>
                            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-xs);">
                                <strong>Citation:</strong> ${opinion.citation}
                            </p>
                            <p style="color: var(--text-secondary);">
                                <strong>Source:</strong> <a href="${opinion.link}" target="_blank" style="color: var(--primary-light);">View on CourtListener</a>
                            </p>
                        </div>
                    </div>

                    <div class="opinion-text" id="precedent-text-${index}">
                        ${opinion.opinion.substring(0, 1000)}${opinion.opinion.length > 1000 ? '...' : ''}
                    </div>

                    <div class="opinion-actions">
                        ${opinion.opinion.length > 1000 ? `
                            <button class="btn btn-outline" onclick="toggleFullText('precedent-text-${index}', ${index}, 'precedent')">
                                📖 View Full Opinion
                            </button>
                        ` : ''}
                        <button class="btn btn-outline" onclick="copyToClipboard(\`${opinion.opinion.replace(/`/g, "\\`")}\`)">
                            📋 Copy Text
                        </button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function toggleFullText(elementId, index, type) {
            const element = document.getElementById(elementId);
            const opinions = type === 'base' ?
                allOpinions.base_opinions[currentCase] :
                allOpinions.precedent_opinions[currentCase];

            const opinionObj = opinions[index];
            const opinionKey = Object.keys(opinionObj)[0];
            const fullText = opinionObj[opinionKey].opinion;

            if (element.textContent.includes('...')) {
                element.textContent = fullText;
                event.target.textContent = '📕 Show Less';
            } else {
                element.textContent = fullText.substring(0, 1000) + '...';
                event.target.textContent = '📖 View Full Opinion';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                UI.showSuccess('Opinion text copied to clipboard!');
            }).catch(err => {
                UI.showError('Failed to copy text.');
            });
        }
    </script>
</body>
</html>
